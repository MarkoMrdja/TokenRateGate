name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  # Primary test job - runs full test suite on latest .NET
  test-main:
    name: Test (ubuntu-latest, .NET 9.0)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore TokenRateGate.sln

    - name: Build
      run: dotnet build TokenRateGate.sln --configuration Release --no-restore

    - name: Run tests (excluding StressTests)
      run: dotnet test TokenRateGate.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --filter "FullyQualifiedName!~StressTests"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-ubuntu-latest-9.0.x
        path: '**/test-results.trx'

  # Compatibility verification - just build on other platforms/versions
  build-compatibility:
    name: Build Compatibility (${{ matrix.os }}, .NET ${{ matrix.dotnet-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        dotnet-version: ['6.0.x', '8.0.x']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore TokenRateGate.sln

    - name: Build
      run: dotnet build TokenRateGate.sln --configuration Release --no-restore

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore TokenRateGate.sln

    - name: Build
      run: dotnet build TokenRateGate.sln --configuration Release --no-restore

    - name: Run tests with coverage (excluding StressTests)
      run: dotnet test TokenRateGate.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage --filter "FullyQualifiedName!~StressTests"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        directory: ./coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  package-validation:
    name: Validate NuGet Packages
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build packages
      run: dotnet pack TokenRateGate.sln --configuration Release --output ./packages

    - name: List packages
      run: ls -lh ./packages

    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./packages/*.nupkg
